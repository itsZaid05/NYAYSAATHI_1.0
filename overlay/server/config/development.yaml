# Local development. Serverpod reads config/<run-mode>.yaml, so this file is what
# `serverpod start` uses. No secrets here — those are in passwords.yaml.
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

database:
  host: localhost
  port: 5432
  name: nyay
  user: postgres

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
